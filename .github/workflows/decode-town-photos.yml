name: Decode town photos
on:
  push:
    paths:
      - "img/towns/_src/**"
      - ".github/workflows/decode-town-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract WebP photos
        run: |
          set -e
          mkdir -p img/towns
          base64 -d img/towns/_src/towns.tar.b64 | tar -C img/towns -xf -
          ls -la img/towns/*.webp
      - name: Commit decoded images
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/towns/*.webp
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Add decoded town WebP photos from Wikimedia Commons"
          git push
