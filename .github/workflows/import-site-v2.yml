name: Import photos-v2 site
on:
  push:
    paths:
      - ".github/workflows/import-site-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site and publish
        run: |
          set -euo pipefail
          mkdir -p /tmp/new
          cat import/_src/site-*.tar.gz.b64 | base64 -d | tar -xzf - -C /tmp/new
          echo "Unpacked files:"
          find /tmp/new -type f | sort
          find /tmp/new -type f | wc -l
          cp -a /tmp/new/. .
          python3 << 'PY'
          from pathlib import Path
          import subprocess
          new_root = Path("/tmp/new")
          new_files = {p.relative_to(new_root).as_posix() for p in new_root.rglob("*") if p.is_file()}
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for f in tracked:
              if f in new_files:
                  continue
              p = Path(f)
              if p.exists() or p.is_symlink():
                  p.unlink()
                  print("removed", f)
          PY
          rm -rf import
          rm -f .github/workflows/import-site-v2.yml
          rm -f .github/workflows/decode-town-photos.yml
          find . -type d -empty -not -path './.git/*' -not -path './.git' -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Publish illustrated map, watercolor wordmark, town photos and listings."
          git pull --rebase origin main
          git push
